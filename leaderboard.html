<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>病毒大作戰排行榜</title>
<style>
:root{--ink:#1d1d26;--paper:#fffaf0;--gold:#ffd166;--pink:#ff7aa8;--bg:#1b2140;--font:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);background:radial-gradient(circle at 50% 0%,#3b3466 0%,var(--bg) 70%);color:#fff;padding:20px 16px 30px}
h1{text-align:center;margin:0 0 4px;font-size:clamp(28px,5vw,52px);text-shadow:0 4px 0 var(--ink)}
.sub{text-align:center;color:#cfd3ff;margin-bottom:16px;font-weight:700}
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.tabs button{font:inherit;font-weight:900;font-size:20px;border:4px solid var(--ink);border-radius:14px;background:#fff;padding:6px 20px;cursor:pointer}
.tabs button.on{background:var(--gold)}
.list{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:70px 1fr auto auto;align-items:center;gap:14px;background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:16px;padding:10px 18px;box-shadow:0 5px 0 rgba(0,0,0,.35);font-size:clamp(18px,2.6vw,26px);font-weight:800}
.row.sm{padding:4px 16px;border-width:3px;border-radius:12px;font-size:clamp(15px,2vw,19px);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.row.sm .rank{font-size:1.1em}
.row.r1{background:#ffe9a8}.row.r2{background:#eef0f5}.row.r3{background:#ffdcc2}
.rank{font-size:1.4em;text-align:center}
.who small{color:#c45a00;font-size:.7em;margin-left:6px}
.title{font-size:.62em;color:#666;font-weight:700}
.pts{color:#c45a00;font-variant-numeric:tabular-nums}
.time{color:#666;font-size:.75em;font-variant-numeric:tabular-nums}
.empty,.err{text-align:center;color:#cfd3ff;font-size:20px;margin-top:30px}
.foot{text-align:center;color:#8f93c9;font-size:13px;margin-top:18px}
@media (max-width:560px){.row{grid-template-columns:44px 1fr auto}.time{display:none}}
</style>
</head>
<body>
<h1>🦠 病毒大作戰排行榜</h1>
<div class="sub">污糟糟中學・急症室大審判</div>
<div class="tabs" id="tabs"><button data-c="ALL" class="on">全部</button><button data-c="3A">3A</button><button data-c="3B">3B</button><button data-c="3C">3C</button></div>
<div class="list" id="list"><div class="empty">載入中……</div></div>
<div class="foot" id="foot">每 10 秒自動更新</div>
<script>
// 與 index.html 相同的 Apps Script 網址
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbw0Chrr7TyXx27H87iBv_qd-IShntKCbC9oc1re82b2zV9OLqh-MrpD75iR8rIJBZNy/exec';
const CN=['','一','二','三','四','五','六','七','八','九','十'];
let cls='ALL';
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{cls=b.dataset.c;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));load();});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mmss(s){s=Number(s)||0;return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function load(){
  const list=document.getElementById('list');
  if(!SHEET_URL){list.innerHTML='<div class="err">未設定排行榜網址（SHEET_URL）</div>';return;}
  fetch(SHEET_URL+'?action=board&best=1&limit=1000&cls='+cls).then(r=>r.json()).then(d=>{
    if(!d.rows.length){list.innerHTML='<div class="empty">暫時未有紀錄</div>';return;}
    list.innerHTML=d.rows.map((r,i)=>{
      const medal=['🥇','🥈','🥉'][i]||(i+1);
      const lab=r.attempt>1?`<small>（第${CN[r.attempt]||r.attempt}次）</small>`:'';
      return `<div class="row ${i<3?'r'+(i+1):i>=10?'sm':''}"><div class="rank">${medal}</div>
        <div class="who">${esc(r.cls)} ${esc(r.no)} 號${lab}<div class="title">${esc(r.title||'')}</div></div>
        <div class="pts">${r.score} 分</div><div class="time">⏱ ${mmss(r.secs)}</div></div>`;}).join('');
    document.getElementById('foot').textContent=`共 ${d.rows.length} 位同學（每人只計最高分）・每 10 秒自動更新・最後更新 `+new Date().toLocaleTimeString('zh-HK');
  }).catch(()=>{list.innerHTML='<div class="err">未能讀取排行榜，請檢查網絡</div>';});
}
load();setInterval(load,10000);
</script>
</body>
</html>

<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>病毒大作戰・題目統計</title>
<style>
body{margin:0;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f3f1fb;color:#1d1d26}
header{background:#6c3fc4;color:#fff;padding:14px 20px}
h1{margin:0;font-size:24px}
.sub{opacity:.85;font-size:14px;margin-top:4px}
.bar{display:flex;gap:8px;align-items:center;padding:12px 20px;flex-wrap:wrap}
.bar button{font:inherit;font-weight:800;border:2px solid #1d1d26;border-radius:10px;background:#fff;padding:5px 14px;cursor:pointer}
.bar button.on{background:#ffd166}
.n{margin-left:auto;font-weight:800}
table{border-collapse:collapse;width:calc(100% - 40px);margin:0 20px 30px;background:#fff}
th,td{border:1px solid #d6d2e8;padding:7px 9px;vertical-align:top;font-size:14px}
th{background:#ece8fa;text-align:left;position:sticky;top:0}
td.num{text-align:center;white-space:nowrap;font-weight:800}
.pct{display:flex;align-items:center;gap:6px}
.pct i{display:block;height:10px;border-radius:5px;background:#3ec98b}
.low{background:#fff1f1}
.ans{color:#2f7a54;font-weight:700}
.wr{color:#c43c3c}
.lv{font-size:12px;border:1px solid #999;border-radius:999px;padding:0 6px;margin-left:4px}
.empty{padding:30px 20px;font-weight:800}
</style></head><body>
<header><h1>🦠 病毒大作戰・題目統計（老師用）</h1>
<div class="sub">只計每位同學第一次玩完的紀錄。按「第一次答對」由低至高排列，紅底＝答對率低於 50%，最需要跟進。</div></header>
<div class="bar" id="tabs"><button data-c="ALL" class="on">全部</button><button data-c="3A">3A</button><button data-c="3B">3B</button><button data-c="3C">3C</button>
<span class="n" id="n"></span></div>
<div id="out"><div class="empty">載入中……</div></div>
<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbw0Chrr7TyXx27H87iBv_qd-IShntKCbC9oc1re82b2zV9OLqh-MrpD75iR8rIJBZNy/exec';
const QS = [{"q": "天花病毒說：「我們都是病原體！」病原體即是甚麼？", "o": ["所有微生物", "能致病的微生物", "所有細菌", "生病的人"], "a": 1, "lv": "簡單"}, {"q": "流感病毒屬於哪一類病原體？", "o": ["細菌", "真菌", "寄生蟲", "病毒"], "a": 3, "lv": "簡單"}, {"q": "霍亂弧菌和紅色毛癬菌的名字都有「菌」字。它們分別屬於哪一類病原體？", "o": ["霍亂弧菌和紅色毛癬菌都是細菌", "霍亂弧菌和紅色毛癬菌都是真菌", "霍亂弧菌是細菌，紅色毛癬菌是真菌", "霍亂弧菌是真菌，紅色毛癬菌是細菌"], "a": 2, "lv": "中等"}, {"q": "以下哪一項對香港腳的描述是正確的？", "o": ["由細菌引起，是傳染病", "由真菌引起，是傳染病", "由真菌引起，是非傳染病", "由病毒引起，經蚊子傳播"], "a": 1, "lv": "中等"}, {"q": "是非題：酵母菌是真菌，所以它一定會令人生病。", "o": ["正確", "錯誤"], "a": 1, "lv": "困難"}, {"q": "流感病毒想感染最多同學，以下哪個情況對它最有利？", "o": ["同學在陽光下的操場上跑步", "同學在更衣室共用拖鞋", "門窗緊閉的課室裏，有同學咳嗽沒有掩口", "小食部的雞肉未煮熟就拿去賣"], "a": 2, "lv": "中等"}, {"q": "霍亂弧菌最擅長經哪一種途徑傳播？", "o": ["空氣／飛沫", "直接接觸", "動物", "水／食物"], "a": 3, "lv": "簡單"}, {"q": "登革熱病毒要靠哪一種動物傳播？", "o": ["家蠅", "白紋伊蚊", "蟑螂", "老鼠"], "a": 1, "lv": "中等"}, {"q": "紅色毛癬菌在泳池更衣室等人，它靠甚麼途徑傳播？", "o": ["直接接觸", "空氣／飛沫", "水／食物", "體液"], "a": 0, "lv": "中等"}, {"q": "以下哪一種疾病經體液傳播（例如共用針筒、輸入受感染的血液）？", "o": ["流感", "肺結核", "香港腳", "愛滋病"], "a": 3, "lv": "中等"}, {"q": "流感病毒乘着飛沫出發，卻撞到一面「牆」。患病的同學做了甚麼？", "o": ["打開窗戶", "用肥皂液洗手", "接種流感疫苗", "戴上口罩"], "a": 3, "lv": "中等"}, {"q": "以下哪一種方法，才能真正殺死生蠔裏的霍亂弧菌？", "o": ["把生蠔徹底煮熟", "擠大量檸檬汁", "放入雪櫃冷藏", "用清水沖洗乾淨"], "a": 0, "lv": "困難"}, {"q": "用肥皂液和清水洗手，最少要揉搓雙手多少秒，才能有效去除細菌？", "o": ["10 秒", "20 秒", "40 秒", "60 秒"], "a": 1, "lv": "困難"}, {"q": "以下哪些方法可以預防登革熱？\n(1) 清除積水　(2) 噴驅蚊劑　(3) 戴口罩", "o": ["只有 (1)", "只有 (1) 和 (2)", "只有 (2) 和 (3)", "(1)、(2) 和 (3)"], "a": 1, "lv": "困難"}, {"q": "疫苗裏面裝的是甚麼？", "o": ["已減弱或已死去的病原體", "抗生素", "抗體", "白血球"], "a": 0, "lv": "中等"}, {"q": "接種疫苗後，免疫系統會產生甚麼來對付病原體？", "o": ["抗生素", "疫苗", "抗體", "維生素 C"], "a": 2, "lv": "中等"}, {"q": "是非題：疫苗的作用是阻止病原體進入身體。", "o": ["正確", "錯誤"], "a": 1, "lv": "困難"}, {"q": "流感病毒經常出現變化。人類應該怎樣做？", "o": ["每年接種流感疫苗", "一生接種一次流感疫苗就足夠", "多吃維生素 C 代替接種疫苗", "不用接種疫苗"], "a": 0, "lv": "困難"}, {"q": "脂質問：「如果陳先生患上心血管疾病，同住的兒子會不會被傳染？」", "o": ["會，經飛沫傳播", "會，經共用餐具傳播", "不會，因為兒子已接種疫苗", "不會，因為心血管疾病是非傳染病"], "a": 3, "lv": "中等"}, {"q": "以下哪些是心血管疾病的風險因素，而且與不健康的生活模式有關？\n(1) 缺乏運動　(2) 年齡　(3) 吸煙", "o": ["只有 (1)", "只有 (1) 和 (2)", "只有 (1) 和 (3)", "(1)、(2) 和 (3)"], "a": 2, "lv": "困難"}, {"q": "脂質積聚在把血液運往心臟肌肉的血管，陳先生會患上甚麼病？", "o": ["中風", "糖尿病", "高血壓", "冠心病"], "a": 3, "lv": "中等"}, {"q": "脂質塞住了腦部的血管，會引致甚麼？", "o": ["中風", "冠心病", "糖尿病", "肺癌"], "a": 0, "lv": "中等"}, {"q": "病人甲：發燒、咳嗽、流鼻水，全班一半人一同請病假。兇手是誰？", "o": ["天花病毒", "霍亂弧菌", "流感病毒", "紅色毛癬菌"], "a": 2, "lv": "簡單"}, {"q": "病人乙吃了放題的生蠔後，不停嘔吐和腹瀉。以下哪一項最可能是生蠔帶菌的原因？", "o": ["生蠔生長的海水受污水污染", "生蠔被蚊子叮咬過", "生蠔放在冰上，溫度太低", "廚師對着生蠔打噴嚏"], "a": 0, "lv": "困難"}, {"q": "病人丙每天吃炸雞、從不運動，最近行樓梯時胸口痛。醫生最應該建議他怎樣做？", "o": ["經常運動，均衡膳食", "每年接種流感疫苗", "服用抗生素", "外出時戴口罩"], "a": 0, "lv": "中等"}, {"q": "病人甲已經發燒咳嗽。他怎樣做，最能保護其他同學？", "o": ["戴上口罩，照常上學", "服用抗生素", "留在家中休息，病好了才上學", "多喝暖水，照常上學"], "a": 2, "lv": "困難"}];
const L = 'ABCD';
let cls = 'ALL';
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  cls = b.dataset.c; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b)); load(); });
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function load() {
  document.getElementById('out').innerHTML = '<div class="empty">載入中……</div>';
  fetch(SHEET_URL + '?action=stats&cls=' + cls).then(r => r.json()).then(d => {
    document.getElementById('n').textContent = `已完成：${d.n} 人`;
    if (!d.n) { document.getElementById('out').innerHTML = '<div class="empty">暫時未有紀錄</div>'; return; }
    const rows = QS.map((q, i) => {
      const s = d.q[i] || { first: 0, wrong: 0, picks: {} };
      const pct = Math.round(100 * s.first / d.n);
      let top = '', topN = 0;
      q.o.forEach((_, k) => { const ch = L[k]; if ((s.picks[ch] || 0) > topN && k !== q.a) { topN = s.picks[ch]; top = ch; } });
      return { i, q, pct, avg: (s.wrong / d.n).toFixed(1), top, topN };
    }).sort((a, b) => a.pct - b.pct || b.avg - a.avg);
    document.getElementById('out').innerHTML = `<table><tr><th>題</th><th>題目</th><th>正確答案</th><th>第一次答對</th><th>平均答錯次數</th><th>最多人誤選</th></tr>` +
      rows.map(r => `<tr class="${r.pct < 50 ? 'low' : ''}"><td class="num">${r.i + 1}</td>
        <td>${esc(r.q.q).replace(/\n/g, '<br>')}<span class="lv">${r.q.lv}</span></td>
        <td class="ans">${L[r.q.a]}. ${esc(r.q.o[r.q.a])}</td>
        <td><div class="pct"><i style="width:${Math.max(2, r.pct * 0.8)}px"></i>${r.pct}%</div></td>
        <td class="num">${r.avg}</td>
        <td class="wr">${r.top ? `${r.top}. ${esc(r.q.o[L.indexOf(r.top)])}（${Math.round(100 * r.topN / d.n)}%）` : '—'}</td></tr>`).join('') + '</table>';
  }).catch(() => { document.getElementById('out').innerHTML = '<div class="empty">未能讀取數據，請檢查網絡</div>'; });
}
load();
</script></body></html>
